[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "fprior"
version = "0.1.0"
description = "Research scaffold for functional-prior multi-kernel genomic prediction"
requires-python = ">=3.11"
dependencies = ["numpy>=2.0,<3", "pyarrow>=20,<27"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]
data = ["pandas>=2.2,<3", "pyfaidx>=0.8,<1"]
baselines = ["scipy>=1.15,<2", "matplotlib>=3.9,<4", "scikit-learn>=1.6,<2"]
# PlantCAD upstream interface versions; CUDA/Mamba kernels require a working GPU.
teacher = [
    "torch>=2.14,<2.15",
    "transformers==4.49.0",
    "peft==0.14.0",
    "einops>=0.8,<1",
    "mamba-ssm==2.2.6.post3",
    "causal-conv1d==1.7.0",
]
cuda-build = [
    "build>=1.3,<2",
    "ninja>=1.11,<2",
    "nvidia-cuda-nvcc==13.0.88",
    "nvidia-nvvm==13.0.88",
    "nvidia-cuda-crt==13.0.88",
    "nvidia-cuda-cccl==13.0.85",
]
