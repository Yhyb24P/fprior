# SoyBase 实验参数与输入预检配置；缺少必填输入，不能运行真实训练。
# 功能分支沿用原数学定义；参考、编码、教师 manifest 与分组审计完成前不得训练。
# 所有相对路径均以 fprior/ 为基准。
schema_version = 2
experiment_version = "soybase_official_funcprior_v3"
seed = 20261010
# 根据本地覆盖及连续组成性状的适配性预先指定，未使用预测分数选性状。
primary_trait_id = "protein"

[output]
directory = "runs"                    # 本项目独立运行目录；不得写入 at_pheno 的 runs/

[data]
# 路径相对本目录(fprior/)
source_genotypes = "data/soybase/raw/genotype/glyma.Wm82.gnm2.div.Song_Hyten_2015.vcf.gz"
source_phenotypes = "data/soybase/raw/phenotype/grin_protein_studies_manifest.json"
directory = "preprocessing/processed/soybase_official_v2" # 官方 GT 标准化产物，非训练就绪声明
source_manifest = "preprocessing/processed/soybase_official_v2/source_manifest.json" # 已验证来源与处理链；划分及教师仍缺失
raw_calls = "data/soybase/raw/genotype/glyma.Wm82.gnm2.div.Song_Hyten_2015.vcf.gz"
reference_build = "Wm82.gnm2.DTC4"     # 官方 README、FASTA 与 VCF REF 已核验
genotype_encoding = "VCF_GT_ALT_dosage_0_1_2_NaN"
phenotype_unit = "% seed dry weight"  # GRIN 描述符；观测选择规则仍须核验
# 新官方队列须冻结独立开发／封存划分；旧材料及其划分保留，不继承父项目划分。
sealed_partition_tsv = ""             # REQUIRED;新版本清单尚未冻结，不得用空清单替代

[data.protein]
source_studies_manifest = "data/soybase/raw/phenotype/grin_protein_studies_manifest.json"
method_documents_manifest = "data/soybase/raw/phenotype/grin_method_documents_manifest.json"
descriptor_id = 51016
aggregation = "equal_study_mean_of_within_study_published_values"
excluded_study_ids = ["490512", "488001"] # developer-supplied or no specified experimental environment
excluded_study_reason = "insufficient_experimental_provenance"
missing_label = "exclude_without_imputation"
transform = "none"

[variant_policy]
kind = "biallelic_snv"
contig_policy = "glyma.Wm82.gnm2.Gm01_to_Gm20_only" # 冻结核染色体目录，排除 scaffold 与 mtDNA
min_train_call_rate = 0.98
maf_min = 0.0
center = "training_mean"
per_variant_scale = "none"           # 不逐位点除等位频率标准差
missing_dosage = "training_mean"
training_monomorphic = "retain_zero_training_column"

[teacher]
# 单一跨物种候选，不代表已在大豆完成接口验证；不得按预测分数换教师。
model = "plantcad/cross_species_acr_train_on_arabidopsis_plantcad2_small"
revision = ""                        # REQUIRED;未落实则停止功能分支
output = "logit_positive_minus_logit_negative"
sequence_length = 600
frozen = true
precision_reference = "float32"
manifest = ""                        # teacher_manifest.json 路径,缺省不加载真实教师

[regions]
max_windows = 256
min_usable_windows = 32
overlap = "forbidden"
min_train_valid_fraction = 0.95
sample_selection = "sha256_region_id_seed"
min_catalog_snps = 2                  # 先按固定标记目录筛候选，再哈希选窗，不看标签或频率
bed = "preprocessing/processed/soybase_official_v2/seed_ctacrs_selected_windows.bed" # 35 个源中心映射窗；训练有效性待验收
fasta = "data/soybase/raw/reference/glyma.Wm82.gnm2.DTC4.genome_main.fna"

[regions.mapping]
version = "seed_ctacrs_lis_exact_map_v1"
source_dataset = "Wm82.gnm4.atlas_ctACRs.Zhang_Schmitz_2024"
source_build = "Wm82.gnm4.4PTR"
source_manifest = "data/soybase/raw/acr/seed_ctacrs_manifest.json"
source_fasta = "data/soybase/raw/reference/glyma.Wm82.gnm4.4PTR.genome_main.fna"
source_coordinates = "BED_0based_halfopen"
min_mapq = 60
sequence_identity = "full_length_zero_edit"
reference_policy = "transfer_complete_source_centered_window_without_remidpointing"
selection_hash_input = "seed_TAB_source_region_id"

[solver]
dtype = "float64"
simplex_denominator = 4
rho = [0.0001, 0.001, 0.01, 0.1, 1, 10, 100]
relative_residual_max = 1.0e-8
spectral_relative_tolerance = 1.0e-10
selection_relative_tolerance = 1.0e-10
feature_identity_relative_tolerance = 1.0e-8

[evaluation]
outer_split = "new_official_cohort_group_constrained" # 待建立并冻结
outer_split_file = ""                 # REQUIRED;不得沿用旧 BiMSGP 队列折号
outer_folds = 10
inner_split = "group_constrained_within_outer_train" # 待实现及冻结；旧版本划分保持稳定
inner_folds = 4
primary_metric = "mse"
practical_relative_mse_gain = 0.02
min_consistent_outer_fraction = 0.80   # 十折对应至少八折同向；评价前固定
descriptive_group_bootstrap_replicates = 2000

[learning_curve]
# 每个外层训练分区内固定组哈希顺序、按整组取嵌套子集；预算为材料数上限。
training_sample_budgets = [128, 512, 2048]
primary_training_sample_budget = 512
selection = "nested_group_hash_without_phenotype"
full_cohort_fit = false               # 全量拟合属后续规模实验，不替代小样本主比较

[baselines.elasticnet]
l1_ratio = [0.1, 0.5, 0.9, 1.0]
alpha_max_ratios = [1.0, 0.1, 0.01, 0.001, 0.0001]
max_iter = 100000
tol = 1.0e-6

[baselines.gbrt]
loss = "squared_error"
max_depth = [1, 2, 3]
learning_rate = [0.03, 0.1]
n_estimators = [100, 300]
min_samples_leaf = 10
subsample = 1.0

[controls]
maf_bin_edges = [0.0, 0.01, 0.05, 0.5]
permutation_replicates = 10
equal_budget_replicates = 10
m2_equal_budget_weights = 5
replicate_seed_rule = "SeedSequence_seed_control_id_repeat_id"

[budget]
profiling_unique_sequences = 64
max_teacher_calls = 200000
max_projected_teacher_gpu_hours = 24
max_host_ram_fraction = 0.70
