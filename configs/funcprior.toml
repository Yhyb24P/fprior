# SoyBase protein 开发评价；Study与模拟未完成不作为开发训练前置条件。
# 所有相对路径均以 fprior/ 为基准。
schema_version = 2
experiment_version = "soybase_official_funcprior_v11_budget2048"
seed = 20261010
# 根据本地覆盖及连续组成性状的适配性预先指定，未使用预测分数选性状。
primary_trait_id = "protein"

[output]
directory = "runs"                    # 本项目独立运行目录；不得写入 at_pheno 的 runs/

[data]
# 路径相对本目录(fprior/)
source_genotypes = "data/soybase/raw/genotype/glyma.Wm82.gnm2.div.Song_Hyten_2015.vcf.gz"
source_phenotypes = "data/soybase/raw/phenotype/grin_protein_studies_manifest.json"
directory = "preprocessing/processed/soybase_official_v2" # 官方 GT 标准化产物，非训练就绪声明
source_manifest = "preprocessing/processed/soybase_official_v2/source_manifest.json" # 复用已验收 v3 输入；新对照使用独立实验版本
raw_calls = "data/soybase/raw/genotype/glyma.Wm82.gnm2.div.Song_Hyten_2015.vcf.gz"
reference_build = "Wm82.gnm2.DTC4"     # 官方 README、FASTA 与 VCF REF 已核验
genotype_encoding = "VCF_GT_ALT_dosage_0_1_2_NaN"
phenotype_unit = "% seed dry weight"  # GRIN 描述符及固定 Study 汇总已核验
# 新官方队列须确定独立开发／封存划分；旧材料及其划分保留，不继承父项目划分。
sealed_partition_tsv = "preprocessing/processed/soybase_official_v2/splits.tsv"
partition_manifest = "preprocessing/processed/soybase_official_v2/partition_manifest.json"

[data.protein]
source_studies_manifest = "data/soybase/raw/phenotype/grin_protein_studies_manifest.json"
method_documents_manifest = "data/soybase/raw/phenotype/grin_method_documents_manifest.json"
descriptor_id = 51016
aggregation = "equal_study_mean_of_within_study_published_values"
excluded_study_ids = ["490512", "488001"] # developer-supplied or no specified experimental environment
excluded_study_reason = "insufficient_experimental_provenance"
missing_label = "exclude_without_imputation"
transform = "none"

[variant_policy]
kind = "biallelic_snv"
contig_policy = "glyma.Wm82.gnm2.Gm01_to_Gm20_only" # 固定核染色体目录，排除 scaffold 与 mtDNA
min_train_call_rate = 0.98
maf_min = 0.0
center = "training_mean"
per_variant_scale = "none"           # 不逐位点除等位频率标准差
missing_dosage = "training_mean"
training_monomorphic = "retain_zero_training_column"

[teacher]
# 单一跨物种候选，已完成接口复现验收；尚不证明大豆 ACR 判别或 protein 预测价值。
model = "plantcad/cross_species_acr_train_on_arabidopsis_plantcad2_small"
revision = "a76b001f89a3be2e12990158bb1903ccddd17625"
output = "logit_positive_minus_logit_negative"
sequence_length = 600
frozen = true
precision_reference = "float32"
inference_version = "plantcad2_float32_canonical_batch1_v1"
inference_batch_size = 1              # 固定模型微批次，避免不同角色／批次产生 FP32 漂移
manifest = "preprocessing/processed/soybase_official_v2/teacher_manifest.json"

[regions]
max_windows = 256
min_usable_windows = 32
overlap = "forbidden"
min_train_valid_fraction = 0.95
sample_selection = "sha256_region_id_seed"
min_catalog_snps = 2                  # 先按固定标记目录筛候选，再哈希选窗，不看标签或频率
bed = "preprocessing/processed/soybase_official_v2/seed_ctacrs_selected_windows.bed" # 已验收的 35 个固定窗口，不按分数补选
fasta = "data/soybase/raw/reference/glyma.Wm82.gnm2.DTC4.genome_main.fna"

[regions.mapping]
version = "seed_ctacrs_lis_exact_map_v1"
source_dataset = "Wm82.gnm4.atlas_ctACRs.Zhang_Schmitz_2024"
source_build = "Wm82.gnm4.4PTR"
source_manifest = "data/soybase/raw/acr/seed_ctacrs_manifest.json"
source_fasta = "data/soybase/raw/reference/glyma.Wm82.gnm4.4PTR.genome_main.fna"
source_coordinates = "BED_0based_halfopen"
min_mapq = 60
sequence_identity = "full_length_zero_edit"
reference_policy = "transfer_complete_source_centered_window_without_remidpointing"
selection_hash_input = "seed_TAB_source_region_id"

[solver]
dtype = "float64"
simplex_denominator = 4
rho = [0.0001, 0.001, 0.01, 0.1, 1, 10, 100]
relative_residual_max = 1.0e-8
spectral_relative_tolerance = 1.0e-10
selection_relative_tolerance = 1.0e-10
feature_identity_relative_tolerance = 1.0e-8

[evaluation]
outer_split = "new_official_cohort_group_constrained"
outer_split_file = "preprocessing/processed/soybase_official_v2/splits.tsv"
inner_split_file = "preprocessing/processed/soybase_official_v2/nested_splits.tsv"
outer_folds = 10
inner_split = "group_constrained_within_outer_train_budget" # 已确定；旧版本划分保持稳定
inner_folds = 4
primary_metric = "mse"
practical_relative_mse_gain = 0.02
min_consistent_outer_fraction = 0.80   # 十折对应至少八折同向；评价前固定
descriptive_group_bootstrap_replicates = 2000

[evaluation.partition]
version = "official_protein_groups_v2"
sealed_fraction = 0.20
group_metric = "exact_ALT_dosage_concordance_on_jointly_called_catalog_SNVs"
min_shared_call_fraction = 0.98
min_concordance = 0.995
group_connection = "transitive_connected_components"
insufficient_shared_calls = "connect_unless_observed_discordances_exclude_full_catalog_near_duplicate"
sealed_selection = "whole_group_hash_prefix_nearest_sample_fraction"
fold_assignment = "descending_group_size_hash_ties_greedy_sample_balance"
hash_namespace = "seed_TAB_sealed_or_outer_or_budget:outer_or_inner:outer:budget_TAB_group_id"
group_device = "cuda"
group_block_size = 512

[learning_curve]
# 每个外层训练分区内固定组哈希顺序、按整组取嵌套子集；预算为材料数上限。
training_sample_budgets = [128, 512, 2048]
primary_training_sample_budget = 512
selection = "nested_group_hash_without_phenotype"
full_cohort_fit = false               # 全量拟合属后续规模实验，不替代小样本主比较

[baselines.elasticnet]
l1_ratio = [0.1, 0.5, 0.9, 1.0]
alpha_max_ratios = [1.0, 0.1, 0.01, 0.001, 0.0001]
max_iter = 100000
tol = 1.0e-6
coordinate_warm_steps = 32
lasso_optimizer = "working_set_with_full_dual_gap_check"

[baselines.gbrt]
loss = "squared_error"
max_depth = [1, 2, 3]
learning_rate = [0.03, 0.1]
n_estimators = [100, 300]
min_samples_leaf = 10
subsample = 1.0

[controls]
maf_bin_edges = [0.0, 0.01, 0.05, 0.5]
permutation_replicates = 10
sign_permutation_replicates = 10
sign_permutation_control_id = 4
equal_budget_replicates = 10
m2_equal_budget_weights = 5
replicate_seed_rule = "SeedSequence_seed_control_id_repeat_id"
residual_weight_permutation_replicates = 10
residual_weight_permutation_control_id = 2
residual_weight_permutation_strata = "window_SNP_count"
interaction_missing_rule = "raw_zero_with_identical_R_validity_mask"
interaction_basis = "all_haplotype_ALT_cooccurrences_of_order_at_least_two"

[models]
families = ["M0", "EN", "MD", "MP", "M1", "M2", "MU", "MW", "MWG", "MHap", "MLocal", "FU", "FU-GBRT", "MI", "MRPerm", "MI3", "MRPerm3", "MSign"]
primary_budget_only = false

[execution]
profile_response = "development_protein"
blas_threads = 12
outer_workers = 2
compute_device = "cuda"
profile_outer_fold = 0              # 当前预算、四内折及一次外层；响应由profile_response指定


[development_evaluation]
protocol_version = "soybase_protein_specificity_v1"
scope = "development_only"
purpose = "method_development_not_independent_validation"
primary_reference = "AdditiveSelection"
auxiliary_reference = "M0"
sealed_evaluation_authorized = false
expected_development_accessions = 14020
expected_windows = 35
locked_recipe_sha256 = "67c4ea0f332a15d3d8688880b3087ea0a52e9e85f85564936a4ca91f2cd9fdd0"
partition_manifest_sha256 = "192eaa75f3205b599409e9c2c16fc0958ebf29bdcf6fc84682d5740f26c96044"
source_manifest_sha256 = "94a04dae6405020c6e096f78e444f40a8e32a85a9f7b890d093a53ce8072f641"
genotypes_sha256 = "a6ef3c9823215b5b270a089d9de15da8358b213dae0efa5a9cba3801e54018f6"
study_observations_status = "NOT_COMPLETED"
synthetic_original_status = "NOT_COMPLETED"
synthetic_sparse_status = "NOT_COMPLETED"

[follow_up]
training_budget = 2048
source_development_run = "runs/soybase_official_funcprior_v6_evaluate_20261012T005958958659Z"
diagnostic_record = "runs/20261012_v6_existing_diagnostics/summary.json"
sign_rule = "independent_SNP_Rademacher_multipliers_preserve_absolute_D"
sign_seed_rule = "SeedSequence_seed_control_id_repeat_window_index"
leave_out_window_index = -1
planned_leave_out_window_index = 16
planned_leave_out_region_id = "glyma.Wm82.gnm4.Gm11:8092839-8093340"
window_selection = "mean_outer_training_centered_R_variance_fraction_v6_no_phenotype"
interpretation = "post_v6_development_specificity_not_independent_validation"
full_simulation_matrix = "not_scheduled"
sealed_values_access = "forbidden"

[budget]
profiling_unique_sequences = 64
max_teacher_calls = 200000
max_projected_teacher_gpu_hours = 24
max_host_ram_fraction = 0.70

# 后续Study与模拟研究设计；本轮开发评价不要求其事先完成。
[pretraining]
protocol_version = "soybase_v5_pretraining_v1"

[pretraining.study]
retrieval = "USDA_GRIN_Global_by_allowed_accession_only"
expected_development_accessions = 14020
pilot_accessions = 20
pilot_selection = "uniform_without_replacement_from_sorted_development_IDs"
pilot_seed_rule = "SeedSequence_seed_20"
whitelist_source = "partition_manifest_and_development_ID_list"
record_fields = ["accession_id", "study_id", "value", "inventory", "method", "source", "source_hash"]
require_source_version = true
require_query_timestamp = true
require_per_accession_outcome = true
forbid_full_phenotype_sources = true
regenerate_labels_or_partitions = false
aggregation_rule_source = "data.protein"
precision_rule = "half_unit_in_last_published_decimal_place"
tolerance_rule = "sum_old_and_new_equal_study_propagated_rounding_bounds_plus_float64_roundoff"
float64_roundoff_multiplier = 32
require_old_and_new_precision_provenance = true
require_historical_precision_before_pilot = false
current_check = "descriptive_cross_study_consistency_within_allowed_development_accessions"
precision_missing = "STOP_WITHOUT_AGGREGATION_ACCEPTANCE"
source_drift_status = "SOURCE_VERSION_DRIFT"
unavailable_status = "STUDY_AUDIT_UNAVAILABLE"

[pretraining.synthetic_original]
expected_datasets = 720
mechanisms = ["S0", "S1", "S2", "S3", "S4", "S5"]
require_actual_instance_records = true
require_mechanism_coverage = true

[pretraining.synthetic_sparse]
expected_instances = 1200
repeats_per_scenario = 200
repeat_first = 0
repeat_last = 199
expected_development_accessions = 14020
expected_catalog_snps = 41346
expected_two_snp_windows = 31
expected_three_snp_windows = 4
training_budget_source = "learning_curve.primary_training_sample_budget"
outer_and_inner_splits_source = "evaluation"
response = "synthetic_only_no_protein_reads"
seed_rule = "SeedSequence_seed_scenario_id_repeat_id"
require_actual_instance_records = true
require_ten_folds_per_instance = true
count_folds_as_repeats = false
pilot_instances = 12
pilot_selection = "each_scenario_repeat_0_and_1"
pilot_purpose = "memory_numerical_equivalence_and_cost_only"
reuse_response_independent_designs = true
require_reuse_equivalence = true

[pretraining.synthetic_sparse.generator]
# 以下细则在任何合成结果产生前确定，不通过试测选择生成机制。
additive_catalog = "all_41346_fixed_catalog_SNVs"
additive_effect_distribution = "independent_Normal_0_1_over_M_variance"
additive_effects_drawn_per_instance = true
additive_missing = "development_population_variant_mean_generation_only"
additive_completely_uncalled = "zero_generator_column_with_explicit_record"
additive_center = "development_population_mean_generation_only"
additive_signal_variance = 1.0
signal_variance_ddof = 0
functional_coefficients = "existing_teacher_coefficients_and_raw_call_validity_masks"
functional_center = "development_population_mean_generation_only"
theta_distribution = "independent_Normal_0_1_over_G_variance"
gamma_distribution = "independent_Normal_0_1_over_G_variance"
functional_signal_variance = 1.0
reweight_windows_to_equal_variance = false
orthogonalize_functional_signal_against_genotypes = false
rp5_permutation_strata_source = "controls.residual_weight_permutation_strata"
child_stream_order = ["additive_effects", "theta_or_gamma", "RP5_permutation", "noise"]
noise_distribution = "independent_Normal_0_1"
coefficient_rule = "sqrt_delta_over_1_minus_delta"
oracle_reference = "known_f_A_without_h"
oracle_full = "known_f_A_plus_c_delta_h"
zero_signal_status = "NO_RESOLVABLE_SIGNAL"
record_actual_signal_variance = true
record_top_three_window_contributions = true

[pretraining.synthetic_sparse.detection]
# 与正式继续研究条件相同；不能使用更宽松的合成专用判据。
gain_and_direction_source = "evaluation"
additive_reference = "inner_selected_M0_or_EN"
first_order_model = "M1"
first_order_controls = ["MD", "MP"]
residual_model = "M2"
residual_controls = ["M1", "MU", "MW", "MWG", "MHap", "MLocal", "MI", "MRPerm", "MI3", "MRPerm3", "MSign"]
matched_control_rule = "strictly_lower_pooled_MSE_than_each_registered_control_repeat"
require_complete_comparisons = true
require_complete_coverage_consistency = true
require_reference_anchor_consistency = true
require_search_budget_consistency = true
n0_event = "first_order_or_residual_full_continuation_event"
rate_denominator = "all_200_preregistered_instances_no_failure_exclusion"
failed_instance = "not_detected_and_technical_failure_recorded"
rp5_event = "residual_continuation_event_reported_as_wrong_teacher_attribution"

[pretraining.synthetic_sparse.acceptance]
null_trigger_rate_max = 0.10
positive_control_detection_rate_min = 0.80
target_detection_rate_min = 0.80
wilson_confidence = 0.95
wilson_z = 1.959963984540054
technical_status_field = "technical_status"
power_status_field = "power_status"
low_power_component_status = "LOW_POWER"
limited_power_status = "POWER_LIMITED"
require_all_instances_and_folds_complete = true
require_existing_numerical_tolerances = true
require_hashes_predictions_and_source_versions = true

